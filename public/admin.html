<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – PhysioPlus Clinic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0d1b3e 0%, #1a56db 50%, #0e3d9e 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card-wrapper {
      width: 100%; max-width: 440px; padding: 20px;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px; padding: 45px 40px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.35);
    }
    .brand { text-align: center; margin-bottom: 35px; }
    .brand-icon {
      width: 70px; height: 70px; background: #1a56db;
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px; font-size: 2rem; color: #fff;
    }
    .brand h2 { font-family: 'Playfair Display', serif; color: #1a56db; font-size: 1.7rem; }
    .brand p { color: #6b7280; font-size: 0.9rem; }

    .tab-switch { display: flex; background: #f3f4f6; border-radius: 12px; padding: 4px; margin-bottom: 28px; }
    .tab-switch button {
      flex: 1; border: none; background: none; padding: 10px; border-radius: 9px;
      font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; color: #6b7280;
    }
    .tab-switch button.active { background: #1a56db; color: #fff; box-shadow: 0 4px 12px rgba(26,86,219,0.3); }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 500; margin-bottom: 6px; color: #374151; font-size: 0.9rem; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
    input {
      width: 100%; padding: 12px 14px 12px 42px; border: 2px solid #e5e7eb;
      border-radius: 12px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s; background: #fff; outline: none;
    }
    input:focus { border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
    .toggle-pass {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: #9ca3af; background: none; border: none;
    }

    .btn-login {
      width: 100%; background: #1a56db; color: #fff; border: none;
      border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { background: #0f3ba8; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .alert-box {
      padding: 12px 16px; border-radius: 10px; margin-bottom: 16px;
      font-size: 0.9rem; display: none;
    }
    .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; }
    .back-link a:hover { color: #fff; }

    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card-wrapper">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">
          <i class="fas fa-heartbeat"></i>
        </div>
        <h2>PhysioPlus Admin</h2>
        <p>Clinic Management System</p>
      </div>

      <!-- Tab Switch -->
      <div class="tab-switch">
        <button class="active" id="tab-login" onclick="switchTab('login')">
          <i class="fas fa-sign-in-alt me-1"></i>Login
        </button>
        <button id="tab-register" onclick="switchTab('register')">
          <i class="fas fa-user-plus me-1"></i>Register
        </button>
      </div>

      <div id="alert-box" class="alert-box"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="login-email" placeholder="admin@clinic.com" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="login-password" placeholder="Enter password" required/>
            <button type="button" class="toggle-pass" onclick="togglePass('login-password')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="login-btn">
          <div class="spinner" id="login-spinner"></div>
          <i class="fas fa-sign-in-alt" id="login-icon"></i>
          <span id="login-text">Login to Dashboard</span>
        </button>
      </form>

      <!-- REGISTER FORM (hidden by default) -->
      <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" id="reg-name" placeholder="Dr. Full Name" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="reg-email" placeholder="admin@clinic.com" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="reg-password" placeholder="Min 6 characters" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Admin Secret Key</label>
          <div class="input-wrap">
            <i class="fas fa-key"></i>
            <input type="password" id="reg-secret" placeholder="Secret registration key" required/>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="fas fa-user-plus me-2"></i>Create Admin Account
        </button>
      </form>
    </div>
    <div class="back-link">
      <a href="/"><i class="fas fa-arrow-left me-1"></i>Back to Main Website</a>
    </div>
  </div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('adminToken')) {
    window.location.href = '/dashboard';
  }

  function switchTab(tab) {
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('tab-login').className = tab === 'login' ? 'active' : '';
    document.getElementById('tab-register').className = tab === 'register' ? 'active' : '';
    hideAlert();
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert-box');
    el.className = `alert-box alert-${type}`;
    el.innerHTML = (type === 'error' ? '⚠️ ' : '✅ ') + msg;
    el.style.display = 'block';
  }

  function hideAlert() {
    document.getElementById('alert-box').style.display = 'none';
  }

  function togglePass(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const spinner = document.getElementById('login-spinner');
    const icon = document.getElementById('login-icon');
    const text = document.getElementById('login-text');

    btn.disabled = true;
    spinner.style.display = 'block';
    icon.style.display = 'none';
    text.textContent = 'Logging in...';

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        showAlert(data.error || 'Login failed', 'error');
      } else {
        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminName', data.admin.name);
        showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/dashboard', 1000);
      }
    } catch(err) {
      showAlert('Network error. Please try again.', 'error');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      icon.style.display = 'inline';
      text.textContent = 'Login to Dashboard';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const secretKey = document.getElementById('reg-secret').value;

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, secretKey })
      });
      const data = await res.json();
      if (!res.ok) {
        const errMsg = data.errors ? data.errors.map(e => e.msg).join(', ') : data.error;
        showAlert(errMsg, 'error');
      } else {
        showAlert('Registered! Please login now.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      }
    } catch(err) {
      showAlert('Network error. Please try again.', 'error');
    }
  }
</script>
</body>
</html>
