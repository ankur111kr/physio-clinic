<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patients – PhysioPlus Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #1a56db; --sidebar-w: 260px; --bg: #f4f6fb; --card: #ffffff; --border: #e5e7eb; }
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); margin: 0; }

    .sidebar { width: var(--sidebar-w); background: #0d1b3e; height: 100vh;
      position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
    .sidebar-logo { padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo h5 { color: #fff; margin: 0; font-size: 1.2rem; font-weight: 700; }
    .sidebar-logo small { color: rgba(255,255,255,0.5); font-size: 0.75rem; }
    .sidebar nav { padding: 20px 12px; }
    .nav-label { color: rgba(255,255,255,0.3); font-size: 0.7rem; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; padding: 8px 10px 6px; }
    .nav-item a { display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 10px;
      font-size: 0.93rem; font-weight: 500; transition: all 0.2s; margin-bottom: 2px; }
    .nav-item a:hover, .nav-item a.active { background: rgba(26,86,219,0.4); color: #fff; }
    .nav-item a i { width: 20px; text-align: center; }
    .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: auto; }
    .sidebar-footer button { width: 100%; background: rgba(239,68,68,0.15); color: #fca5a5;
      border: none; border-radius: 10px; padding: 10px; cursor: pointer; }

    .main { margin-left: var(--sidebar-w); min-height: 100vh; }
    .topbar { background: var(--card); padding: 16px 28px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border); }
    .topbar h4 { margin: 0; font-weight: 700; }
    .content { padding: 28px; }
    .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--border); }
    .panel-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .panel-header h6 { margin: 0; font-weight: 700; font-size: 1rem; }
    .panel-body { padding: 22px; }

    /* PATIENT CARDS */
    .patient-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 22px; transition: all 0.2s; cursor: pointer; }
    .patient-card:hover { border-color: var(--primary); box-shadow: 0 8px 25px rgba(26,86,219,0.12);
      transform: translateY(-2px); }
    .patient-avatar { width: 48px; height: 48px; background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0; }
    .visit-count { background: #eff6ff; color: #1d4ed8; padding: 3px 10px;
      border-radius: 25px; font-size: 0.78rem; font-weight: 600; }

    /* MODAL STYLES */
    .modal-content { border-radius: 20px; border: none; }
    .modal-header { background: #0d1b3e; color: #fff; border-radius: 20px 20px 0 0; padding: 20px 25px; }
    .modal-header .btn-close { filter: invert(1); }
    .form-control, .form-select, .form-control-sm { border: 2px solid #e5e7eb; border-radius: 10px; }
    .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }

    /* VISIT HISTORY */
    .visit-item { background: #f8faff; border-radius: 12px; padding: 18px; margin-bottom: 12px;
      border-left: 4px solid var(--primary); }
    .visit-item:last-child { margin-bottom: 0; }
    .visit-date { color: var(--primary); font-weight: 700; font-size: 0.88rem; margin-bottom: 10px; }
    .visit-field { margin-bottom: 6px; font-size: 0.9rem; }
    .visit-field strong { color: #374151; }
    .visit-field span { color: #555; }

    /* PRESCRIPTION ACTIONS */
    .action-btn { padding: 8px 16px; border-radius: 10px; font-size: 0.88rem;
      font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-pdf { background: #fee2e2; color: #b91c1c; }
    .btn-pdf:hover { background: #fca5a5; }
    .btn-whatsapp { background: #dcfce7; color: #15803d; }
    .btn-whatsapp:hover { background: #86efac; }
    .btn-print { background: #eff6ff; color: #1d4ed8; }
    .btn-print:hover { background: #bfdbfe; }

    @media(max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <h5><i class="fas fa-heartbeat me-2" style="color:#1a56db;"></i>PhysioPlus</h5>
    <small>Patient Management</small>
  </div>
  <nav>
    <div class="nav-label">Main</div>
    <div class="nav-item"><a href="/dashboard"><i class="fas fa-tachometer-alt"></i>Dashboard</a></div>
    <div class="nav-item"><a href="/dashboard" onclick="setTimeout(()=>showSection('appointments'),100)"><i class="fas fa-calendar-check"></i>Appointments</a></div>
    <div class="nav-item"><a href="/patients" class="active"><i class="fas fa-users"></i>Patients</a></div>
    <div class="nav-item"><a href="/"><i class="fas fa-globe"></i>View Website</a></div>
  </nav>
  <div class="sidebar-footer">
    <button onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button style="background:none;border:none;font-size:1.3rem;" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <i class="fas fa-bars"></i>
      </button>
      <h4>Patient Management</h4>
    </div>
    <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#addPatientModal">
      <i class="fas fa-plus me-2"></i>Add Patient Visit
    </button>
  </div>

  <div class="content">
    <!-- Search + Stats -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="fas fa-search text-muted"></i>
          </span>
          <input type="text" id="search-input" class="form-control border-start-0"
            placeholder="Search by name or phone..." oninput="searchPatients(this.value)"
            style="border-radius: 0 12px 12px 0; border: 2px solid #e5e7eb; border-left: none;"/>
        </div>
      </div>
    </div>

    <!-- Patient Grid -->
    <div id="patients-grid" class="row g-3">
      <div class="col-12 text-center text-muted py-5">
        <i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br>Loading patients...
      </div>
    </div>
  </div>
</div>

<!-- ADD PATIENT MODAL -->
<div class="modal fade" id="addPatientModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Add Patient Visit</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="add-alert" class="alert d-none"></div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-500">Full Name *</label>
            <input type="text" id="p-name" class="form-control" placeholder="Patient name"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-500">Phone *</label>
            <input type="tel" id="p-phone" class="form-control" placeholder="+91 98765 43210"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-500">Email</label>
            <input type="email" id="p-email" class="form-control" placeholder="email@example.com"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-500">Age</label>
            <input type="number" id="p-age" class="form-control" placeholder="30" min="0" max="120"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-500">Gender</label>
            <select id="p-gender" class="form-select">
              <option value="">Select</option>
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label fw-500">Address</label>
            <input type="text" id="p-address" class="form-control" placeholder="Full address"/>
          </div>

          <div class="col-12"><hr class="my-1"/><h6 class="fw-700 text-primary">Visit Information</h6></div>

          <div class="col-12">
            <label class="form-label fw-500">Problem / Diagnosis *</label>
            <textarea id="p-problem" class="form-control" rows="2" placeholder="Describe the patient's problem or diagnosis"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-500">Treatment Given *</label>
            <textarea id="p-treatment" class="form-control" rows="2" placeholder="Treatment provided during this visit"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-500">Prescription / Medicines</label>
            <textarea id="p-prescription" class="form-control" rows="2" placeholder="Tab. Ibuprofen 400mg BD, Cap. Calcium 500mg OD..."></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-500">Additional Notes</label>
            <input type="text" id="p-notes" class="form-control" placeholder="Follow up instructions, precautions..."/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-500">Next Visit Date</label>
            <input type="text" id="p-next" class="form-control" placeholder="e.g. After 1 week / 2024-12-20"/>
          </div>
        </div>
      </div>
      <div class="modal-footer px-4 pb-4 pt-0 border-0">
        <button class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary rounded-pill px-4" onclick="savePatient()">
          <i class="fas fa-save me-2"></i>Save Visit Record
        </button>
      </div>
    </div>
  </div>
</div>

<!-- PATIENT DETAIL MODAL -->
<div class="modal fade" id="patientDetailModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detail-modal-title">Patient History</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0" id="patient-detail-body">
        <div class="text-center py-5 text-muted">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem('adminToken');
if (!token) window.location.href = '/admin';
const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

function logout() {
  localStorage.clear();
  window.location.href = '/admin';
}

// ---- LOAD ALL PATIENTS ----
let allPatients = [];
async function loadPatients(search = '') {
  const url = search ? `/api/patients?search=${encodeURIComponent(search)}` : '/api/patients';
  try {
    const res = await fetch(url, { headers });
    allPatients = await res.json();
    renderPatients(allPatients);
  } catch(e) {
    document.getElementById('patients-grid').innerHTML = '<div class="col-12 text-center text-danger py-5">Error loading patients.</div>';
  }
}

function renderPatients(patients) {
  const grid = document.getElementById('patients-grid');
  if (!patients.length) {
    grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="fas fa-users fa-3x mb-3"></i><br>No patients found. Add a new patient visit to get started.</div>';
    return;
  }
  grid.innerHTML = patients.map(p => `
    <div class="col-md-6 col-lg-4" onclick="openPatientDetail('${p._id}')">
      <div class="patient-card">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="patient-avatar">${p.gender === 'Female' ? '👩' : '👨'}</div>
          <div class="flex-grow-1 min-width-0">
            <div class="fw-700 text-truncate">${p.name}</div>
            <div class="text-muted small">${p.phone}</div>
          </div>
          <span class="visit-count">${p.visits.length} visit${p.visits.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="row g-2 text-sm" style="font-size:0.85rem;">
          <div class="col-6 text-muted">
            <i class="fas fa-birthday-cake me-1"></i>${p.age ? p.age + ' yrs' : 'Age N/A'}
          </div>
          <div class="col-6 text-muted">
            <i class="fas fa-venus-mars me-1"></i>${p.gender || 'N/A'}
          </div>
          <div class="col-12 text-muted text-truncate">
            <i class="fas fa-stethoscope me-1"></i>
            ${p.visits.length ? p.visits[p.visits.length-1].problem : 'No visits yet'}
          </div>
        </div>
        <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
          <small class="text-muted">
            Last: ${p.visits.length ? new Date(p.visits[p.visits.length-1].date).toLocaleDateString('en-IN') : '—'}
          </small>
          <div class="d-flex gap-1">
            <button class="action-btn btn-pdf py-1 px-2" onclick="event.stopPropagation(); downloadPDF('${p._id}', '${p.name}')">
              <i class="fas fa-file-pdf"></i>
            </button>
            <button class="action-btn btn-whatsapp py-1 px-2" onclick="event.stopPropagation(); sendWhatsApp('${p._id}')">
              <i class="fab fa-whatsapp"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function searchPatients(val) {
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(() => loadPatients(val), 300);
}

// ---- SAVE PATIENT ----
async function savePatient() {
  const data = {
    name: document.getElementById('p-name').value.trim(),
    phone: document.getElementById('p-phone').value.trim(),
    email: document.getElementById('p-email').value.trim(),
    age: document.getElementById('p-age').value,
    gender: document.getElementById('p-gender').value,
    address: document.getElementById('p-address').value.trim(),
    problem: document.getElementById('p-problem').value.trim(),
    treatment: document.getElementById('p-treatment').value.trim(),
    prescription: document.getElementById('p-prescription').value.trim(),
    notes: document.getElementById('p-notes').value.trim(),
    nextVisit: document.getElementById('p-next').value.trim()
  };

  const alertEl = document.getElementById('add-alert');
  if (!data.name || !data.phone || !data.problem || !data.treatment) {
    alertEl.className = 'alert alert-warning';
    alertEl.textContent = '⚠️ Please fill all required fields (Name, Phone, Problem, Treatment).';
    alertEl.classList.remove('d-none');
    return;
  }

  try {
    const res = await fetch('/api/patients', {
      method: 'POST', headers,
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (!res.ok) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = '❌ ' + (result.error || 'Error saving patient.');
      alertEl.classList.remove('d-none');
    } else {
      bootstrap.Modal.getInstance(document.getElementById('addPatientModal')).hide();
      // Clear form
      ['p-name','p-phone','p-email','p-age','p-address','p-problem','p-treatment','p-prescription','p-notes','p-next'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('p-gender').value = '';
      alertEl.classList.add('d-none');
      loadPatients();
    }
  } catch(e) {
    alertEl.className = 'alert alert-danger';
    alertEl.textContent = '❌ Network error. Please try again.';
    alertEl.classList.remove('d-none');
  }
}

// ---- PATIENT DETAIL MODAL ----
async function openPatientDetail(id) {
  const modal = new bootstrap.Modal(document.getElementById('patientDetailModal'));
  modal.show();
  document.getElementById('patient-detail-body').innerHTML = '<div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

  try {
    const res = await fetch(`/api/patients/${id}`, { headers });
    const p = await res.json();
    document.getElementById('detail-modal-title').textContent = `${p.name} — Full History`;

    document.getElementById('patient-detail-body').innerHTML = `
      <div class="p-4">
        <!-- Patient Info -->
        <div class="row g-3 mb-4">
          <div class="col-md-3 text-center">
            <div style="font-size:4rem;">${p.gender === 'Female' ? '👩' : '👨'}</div>
            <h5 class="fw-700 mb-1">${p.name}</h5>
            <span class="badge bg-primary rounded-pill px-3">${p.visits.length} Visit${p.visits.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="col-md-9">
            <div class="row g-2" style="font-size:0.9rem;">
              <div class="col-6"><strong>📞 Phone:</strong> ${p.phone}</div>
              <div class="col-6"><strong>✉️ Email:</strong> ${p.email || '—'}</div>
              <div class="col-6"><strong>🎂 Age:</strong> ${p.age ? p.age + ' years' : '—'}</div>
              <div class="col-6"><strong>⚥ Gender:</strong> ${p.gender || '—'}</div>
              <div class="col-12"><strong>🏠 Address:</strong> ${p.address || '—'}</div>
              <div class="col-6"><strong>📅 Registered:</strong> ${new Date(p.createdAt).toLocaleDateString('en-IN')}</div>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button class="action-btn btn-pdf" onclick="downloadPDF('${p._id}', '${p.name}')">
                <i class="fas fa-file-pdf"></i> Download PDF
              </button>
              <button class="action-btn btn-print" onclick="printPrescription('${p._id}')">
                <i class="fas fa-print"></i> Print
              </button>
              <button class="action-btn btn-whatsapp" onclick="sendWhatsApp('${p._id}')">
                <i class="fab fa-whatsapp"></i> Send WhatsApp
              </button>
              <button class="action-btn" style="background:#fee2e2;color:#b91c1c;" onclick="deletePatient('${p._id}')">
                <i class="fas fa-trash"></i> Delete
              </button>
            </div>
          </div>
        </div>

        <!-- Visit History -->
        <h6 class="fw-700 mb-3"><i class="fas fa-history me-2 text-primary"></i>Visit History (${p.visits.length} visits)</h6>
        ${p.visits.length === 0 ? '<p class="text-muted">No visits recorded yet.</p>' :
          [...p.visits].reverse().map((v, i) => `
            <div class="visit-item">
              <div class="visit-date">
                <i class="fas fa-calendar me-2"></i>Visit #${p.visits.length - i} — ${new Date(v.date).toLocaleDateString('en-IN', {weekday:'long', year:'numeric', month:'long', day:'numeric'})}
              </div>
              <div class="row g-2">
              <div class="col-md-6 visit-field"><strong>🩺 Problem:</strong> <span>${v.problem}</span></div>
                <div class="col-md-6 visit-field"><strong>💉 Treatment:</strong> <span>${v.treatment}</span></div>
                <div class="col-md-6 visit-field"><strong>💊 Prescription:</strong> <span>${v.prescription || '—'}</span></div>
                <div class="col-md-6 visit-field"><strong>📝 Notes:</strong> <span>${v.notes || '—'}</span></div>
                <div class="col-md-6 visit-field"><strong>🔜 Next Visit:</strong> <span>${v.nextVisit || 'As required'}</span></div>
                <div class="col-md-6 visit-field"><strong>👨‍⚕️ Doctor:</strong> <span>${v.doctor || 'Dr. Physio'}</span></div>
              </div>
            </div>
          `).join('')
        }
      </div>
    `;
  } catch(e) {
    document.getElementById('patient-detail-body').innerHTML = '<div class="text-center py-5 text-danger">Error loading patient details.</div>';
  }
}

// ---- PDF DOWNLOAD ----
async function downloadPDF(id, name) {
  const a = document.createElement('a');
  a.href = `/api/patients/${id}/prescription?t=${token}`;
  // PDF route requires auth — we pass token as query param workaround
  // For proper production, use a short-lived token or session
  const res = await fetch(`/api/patients/${id}/prescription`, { headers });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = `Prescription_${name.replace(/\s+/g,'_')}.pdf`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---- PRINT ----
async function printPrescription(id) {
  const res = await fetch(`/api/patients/${id}/prescription`, { headers });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const win = window.open(url);
  win.onload = () => { win.print(); };
}

// ---- WHATSAPP ----
async function sendWhatsApp(id) {
  try {
    const res = await fetch(`/api/whatsapp/${id}`, { headers });
    const data = await res.json();
    window.open(data.url, '_blank');
  } catch(e) {
    alert('Error generating WhatsApp link.');
  }
}

// ---- DELETE PATIENT ----
async function deletePatient(id) {
  if (!confirm('Delete this patient and all their records? This cannot be undone.')) return;
  await fetch(`/api/patients/${id}`, { method: 'DELETE', headers });
  bootstrap.Modal.getInstance(document.getElementById('patientDetailModal')).hide();
  loadPatients();
}

// ---- INIT ----
loadPatients();
</script>
</body>
</html>
                <div class="col-md-6 visit-fie
